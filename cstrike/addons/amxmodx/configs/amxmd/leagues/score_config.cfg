// AMX Match Deluxe - Score Display Configuration
// =============================================
//
// Instructions:
// 1. Copy this file to one of these locations in your CS server:
//    - cstrike/addons/amxmodx/configs/score_config.cfg  (recommended)
//    - cstrike/score_config.cfg
//    - cstrike/amxmd/score_config.cfg
//
// 2. Edit the values below to customize your score display
// 3. Save this file and restart the server or reload the plugin
//
// Your match command: amx_match Aimbots AlQaida mr15 cal

// === TEAM NAMES CUSTOMIZATION ===
// Based on your match command, but you can change these to anything

// Team 1 (Counter-Terrorists) - Currently "Aimbots"
team1_name "Aimbots"

// Team 2 (Terrorists) - Currently "AlQaida" 
team2_name "AlQaida"

// === SCORE DISPLAY COLORS ===
// Format: R G B (Red Green Blue values from 0 to 255)

// Main text color (default: bright white)
score_color_r "255"
score_color_g "255"
score_color_b "255"

// Winning team color (when a team is leading) - Bright Green
winning_color_r "0"
winning_color_g "255"
winning_color_b "0"

// Losing team color - Light Red
losing_color_r "255"
losing_color_g "100"
losing_color_b "100"

// Draw/tie color (when scores are equal) - Yellow
draw_color_r "255"
draw_color_g "255"
draw_color_b "0"

// === DISPLAY SETTINGS ===
// Show time in seconds (how long scores stay visible)
display_time "12.0"

// Text size multiplier (1.0 = normal, 2.0 = double size, etc.)
text_size "2.0"

// === COLOR PRESETS ===
// Uncomment one of these preset combinations:

// Preset 1: Classic Blue vs Red
// score_color_r "255"; score_color_g "255"; score_color_b "255"
// winning_color_r "100"; winning_color_g "150"; winning_color_b "255"
// losing_color_r "255"; losing_color_g "100"; losing_color_b "100"

// Preset 2: Green vs Orange
// score_color_r "255"; score_color_g "255"; score_color_b "255" 
// winning_color_r "0"; winning_color_g "255"; winning_color_b "0"
// losing_color_r "255"; losing_color_g "165"; losing_color_b "0"

// Preset 3: Purple vs Gold
// score_color_r "255"; score_color_g "255"; score_color_b "255"
// winning_color_r "128"; winning_color_g "0"; winning_color_b "128"  
// losing_color_r "255"; losing_color_g "215"; losing_color_b "0"
