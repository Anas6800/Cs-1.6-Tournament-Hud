// This is the FFA server config file
// you can reload some plug-ins like the stats
// and get some cvars to their old value

pausable 0 
mp_maxrounds 0
mp_winlimit 0
mp_timelimit 35
mp_autoteambalance 1
mp_limitteams 2
mp_fadetoblack 0 
mp_forcechasecam 2
mp_forcecamera 2
mp_friendlyfire 0
mp_autokick 1
mp_tkpunish 1

amxx unpause antiflood.amxx
amxx unpause scrollmsg.amxx
amxx unpause imessage.amxx
amxx unpause mapchooser.amxx
amxx unpause statsx.amxx
// amxx unpause miscstats.amxx (not installed)
// meta unpause statsme (not installed)

say FFA config loaded...
